# PryTax for the web (builds.md §2): the app, the queue worker and the scheduler run one image.
#
#   MySQL in a container:   DB_HOST=mysql in .env, then `docker compose --profile mysql up -d --build`
#   An external MySQL:      DB_HOST and the credentials in .env, then `docker compose up -d --build`
#
# The settings come from .env (see .env.docker.example). In a development checkout, whose .env is the local one, keep
# them in .env.docker with PRYTAX_ENV_FILE=.env.docker in it, and add `--env-file .env.docker` to every command.
# Building takes api-core from its private GitHub repository: COMPOSER_AUTH, in the shell, holds a token, which may
# read it (`gh auth token` gives one). README.md ("Running with Docker") has the first owner.

# One person's installation (builds.md §1.4): as the file compose reads its variables from says (.env, or
# --env-file's), and always when `./prytax docker` starts it, which sets it in compose's environment
x-prytax-environment: &prytax-environment
  PRYTAX_SINGLE_ORGANIZATION: ${PRYTAX_SINGLE_ORGANIZATION:-false}

x-prytax: &prytax
  image: prytax:latest
  env_file: ${PRYTAX_ENV_FILE:-.env}
  environment:
    <<: *prytax-environment
  restart: unless-stopped
  volumes:
    - storage:/app/storage
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  app:
    <<: *prytax
    build:
      context: .
      # A token, which may read api-core's private repository (Dockerfile)
      secrets:
        - composer_auth
    environment:
      <<: *prytax-environment
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
        required: false

  worker:
    <<: *prytax
    command: ["php", "artisan", "queue:work", "--queue=backups,retention,default", "--sleep=3", "--max-time=3600"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *prytax
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    profiles: [mysql]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-prytax}
      MYSQL_USER: ${DB_USERNAME:-prytax}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  storage:
  mysql:

secrets:
  # Composer's credentials, from the shell that builds: COMPOSER_AUTH='{"github-oauth":{"github.com":"<token>"}}'
  composer_auth:
    environment: COMPOSER_AUTH
